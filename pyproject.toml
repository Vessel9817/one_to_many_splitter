[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "one_to_many_splitter"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license-files = ["LICEN[CS]E*", "*.license"]

[dependency-groups]
publish = []
typing = ["mypy >= 2.3.1"]

[project.urls]
Homepage = "https://github.com/Vessel9817/one_to_many_splitter"
Issues = "https://github.com/Vessel9817/one_to_many_splitter/issues"
